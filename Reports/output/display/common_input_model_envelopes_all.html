ected six-year solar precision (NuFIT centre, diagonal errors); not a global future fit. Point markers: T1 small circles, T2 crosses, T3 larger circles. Blue ovals: Gaussian NuFIT 1σ (Δχ²=2.30) and 3σ (Δχ²=11.83) approximations, NOT official NuFIT joint contours. T1 solid, T2 dashed, T3 dotted. A missing oval means the saved points do not span a full-rank 2D region. Framing controls affect the axes only; uncertainty regions remain drawn even when outside the view.';$('source').textContent=D.models.length+' common-input models plotted; '+D.skipped.length+' skipped. No recomputation. Source: '+D.source}
