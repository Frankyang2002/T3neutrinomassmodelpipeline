D.models.forEach((m,i)=>{if(!enabled[m.model])return;const color=COLORS[i%COLORS.length];if($('envelopes').checked)ellipse(modelOval(m),color,.10);if($('trajectories').checked)for(const d of ['T1','T2','T3']){if(!dirs[d])continue;const pts=selectedPoints(m,d);ctx.beginPath();pts.forEach((p,j)=>j?ctx.lineTo(X(p[x]),Y(p[y])):ctx.moveTo(X(p[x]),Y(p[y])));ctx.strokeStyle=color;ctx.setLineDash(d==='T1'?[]:d==='T2'?[7,4]:[2,4]);ctx.lineWidth=1.7;ctx.stroke();ctx.setLineDash([])}if($('points').checked)for(const d of ['T1','T2','T3']){if(!dirs[d])continue;for(const p of selectedPoints(m,d)){const xx=X(p[x]),yy=Y(p[y]);if(Math.abs(p.gamma-1)<1e-9)continue;ctx.strokeStyle=color;ctx.lineWidth=1.15;ctx.beginPath();if(d==='T2'){ctx.moveTo(xx-3,yy-3);ctx.lineTo(xx+3,yy+3);ctx.moveTo(xx-3,yy+3);ctx.lineTo(xx+3,yy-3)}else{ctx.arc(xx,yy,d==='T1'?2.4:3.3,0,2*Math.PI)}ctx.stroke()}}if($('centres').checked){ctx.beginPath();ctx.arc(X(m.centre[x]),Y(m.centre[y]),4,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke()}});ctx.restore();ctx.strokeStyle='#e1e7ee';ctx.fillStyle='#526074';ctx.font='11px system-ui';for(let i=0;i<=5;i++){let v=xmin+(xmax-xmin)*i/5,p=X(v);ctx.beginPath();ctx.moveTo(p,T);ctx.lineTo(p,T+ph);ctx.stroke();ctx.textAlign='center';ctx.fillText(v.toPrecision(4),p,T+ph+17)}for(let i=0;i<=5;i++){let v=ymin+(ymax-ymin)*i/5,p=Y(v);ctx.beginPath();ctx.moveTo(L,p);ctx.lineTo(L+pw,p);ctx.stroke();ctx.textAlign='right';ctx.fillText(v.toPrecision(4),L-8,p+3)}ctx.strokeStyle='#475569';ctx.strokeRect(L,T,pw,ph);ctx.font='13px system-ui';ctx.textAlign='center';ctx.fillStyle='#17243b';ctx.fillText(D.labels[x],L+pw/2,h-17);ctx.save();ctx.translate(19,T+ph/2);ctx.rotate(-Math.PI/2);ctx.fillText(D.labels[y],0,0);ctx.restore();$('note').textContent='Coloured ovals: 2× empirical standard-deviation covariance of saved fermion-start sensitivity points about each fitted centre; descriptive envelopes, NOT model confidence regions. Automatic axes use
